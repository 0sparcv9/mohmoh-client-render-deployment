<!DOCTYPE HTML>
<html lang="en">
<head>
	<script src="./mohmoh.js"></script>
	<meta charset="UTF-8">
	<title>Moh Moh Vanilla</title>
	<meta name="viewport"
	  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=0, viewport-fit=cover">
	<meta name="description" content='MohMoh Vanilla is a fork of original mohmoh for hackers'>
	<meta http-equiv="cache-control" content="no-cache">
	<meta http-equiv="expires" content="0">
	<meta http-equiv="pragma" content="no-cache">
	<link rel="stylesheet" href="./mohmoh.css" />
	<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Hammersmith+One" rel="stylesheet">
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> 
</head>

<body>
  <!-- FAKE ELEMENTS -->
  
  <noop>
    <noop>
      <noop class = "menuLink"> </noop>
      <noop id = "joinPartyButton"> </noop>
      <noop id = "pre-content-container"> </noop>
      <noop id = "promoImgHolder"> </noop>
      <noop id = "adCard"> </noop>
      <noop id = "touch-controls-fullscreen"> </noop>
      <noop id = "settingsButton"> <span> </span> </noop>
      <noop id = "featuredYoutube"> </noop>
      <noop id = "guideCard"> </noop>
      <noop id = "promoImg"> </noop>
      <noop id = "gameName"> </noop>
      <noop id = "altServer"> </noop>
      <noop id = "leaderboardButton"> </noop>
    </noop>
  </noop>

	<div id="mainMenu">
    <div id="bottomText">@MVA 2024-2025. Not affiliated with FRVR.</div>
		<div id="loadingText">Connecting...</div>
    <div id="mohmohTitle"> MohMoh Vanilla </div>
    <div class="staticMenuCard">
      <div class="slider">  </div>
      <button class="tabSwitch" tabindex="-1" onclick="chooseTab(0)" style="margin-left: 2.1%"> Home </button>
      <button class="tabSwitch" tabindex="0" onclick="chooseTab(1)"> Servers </button>
      <button class="tabSwitch" tabindex="1" onclick="chooseTab(2)"> Skins </button>
      <button class="tabSwitch" tabindex="1" onclick="chooseTab(3)"> Options </button>
    </div>
    <div id="menuCardHolder">
				<div class="menuCard">
					<input type="text" id="nameInput" placeholder="Your Name" maxlength="15"
						value="unknown"></input>
          <div id="enterGame" class="menuButton"><span>Play</span></div> <br>
        </div>
        <div class="menuCard" style="display: none">
          <div class="menuHeader" style="margin-top:10px; text-align: center">Choose server</div>
          <select id="serverBrowser"></select>
          <div id="partyButton" style="visibility: hidden"><span></span></div>
        </div>
        <div class="menuCard" style="display: none">
          <div class="menuHeader" style="margin-top:10px; text-align: center">Choose your skin</div>
          <div id="skinColorHolder"></div> <br>
          <canvas id="skinPreview"> </canvas>
        </div>
        <div class="menuCard" style="display: none">
          <div class="menuHeader" style="text-align: center"> Bundle Options </div>
          <div class="settingRadio"> <input name="nativeResolution" id="nativeResolution" type="checkbox" /> <label for="nativeResolution"> Max quality </label> </div>
          <div class="settingRadio"> <input name="showPing" id="showPing" type="checkbox" /> <label for="showPing"> Ping display </label> </div>
          <div class="settingRadio"> <input name="webGl" id="webGl" type="checkbox" /> <label for="webGl"> WebGL Rendering </label> </div>
        </div>
      </div>
		<div id="pingDisplay" hidden>Not connected</div>
	</div>
	<div id="diedText">GG</div>
	<div id="gameUI" style="display: none;">
		<div id="chatHolder" style="display:none;">
			<input id="chatBox" type="text" placeholder="Enter Message" maxlength="30"></input>
		</div>
		<div id="upgradeHolder"></div>
		<div id="upgradeCounter"></div>
		<div id="ageText"></div>
		<div id="ageBarContainer">
			<div id="ageBar">
				<div id="ageBarBody"></div>
			</div>
		</div>
		<div id="topInfoHolder">
			<div id="leaderboard">
				<div id="leaderboardData"></div>
			</div>
			<div></div>
			<div id="killCounter" class="resourceDisplay"></div>
		</div>
		<div id="itemInfoHolder" class="uiElement">
		</div>
		<div id="resDisplay">
			<div id="foodDisplay" class="resourceDisplay"></div>
			<div id="woodDisplay" class="resourceDisplay"></div>
			<div id="stoneDisplay" class="resourceDisplay"></div>
			<div id="scoreDisplay" class="resourceDisplay"></div>
		</div>
		<div id="actionBar"></div>
		<div id="noticationDisplay" style="display:none"></div>
		<div id="allianceButton" class="uiElement gameButton">
			<i class="material-icons" style="font-size:40px;vertical-align:middle">&#xE8D3;</i>
		</div>
		<div id="storeButton" class="uiElement gameButton">
			<i class="material-icons" style="font-size:40px;vertical-align:middle">&#xE8D1;</i>
		</div>
		<div id="chatButton" class="uiElement gameButton">
			<i class="material-icons" style="font-size:40px;vertical-align:middle">&#xE8AF;</i>
		</div>
		<canvas id="mapDisplay">
		</canvas>
		<div id="storeMenu">
			<div style="padding-bottom:15px">
				<div class="storeTab" style="margin-right:10px" onclick="changeStoreIndex(0)">Hats</div>
				<div class="storeTab" onclick="changeStoreIndex(1)">Accessories</div>
			</div>
			<div id="storeHolder">
			</div>
		</div>
		<div id="allianceMenu">
			<div id="allianceHolder"></div>
			<div id="allianceManager"></div>
		</div>
	</div>
	<canvas id="gameCanvas"></canvas>
	</div></div></div>
</body>
</html>
